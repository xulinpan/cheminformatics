[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msms-controls"
version = "0.1.0"
description = "Two controls for attributing gains in MS/MS spectral-representation studies: a rounding control and a conditioning-parity check"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Xulin Pan", email = "xulinpanias@gmail.com" },
    { name = "Chuanming Wang" },
]
keywords = ["mass-spectrometry", "tandem-ms", "msms", "cheminformatics",
            "ablation", "experimental-design", "spectral-representation",
            "mass-defect", "binning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/xulinpan/cheminformatics"
Issues = "https://github.com/xulinpan/cheminformatics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msms_controls = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
